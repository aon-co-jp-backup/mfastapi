name: wheels

# 配布用ホイール(manylinux / macOS / Windows)をビルドし、各ホイールで等価性テストを実行する。
# PyPIへの公開は含めない(アカウント・信頼できる発行元の設定が必要なため)。成果物はActionsのアーティファクトとして保存する。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_SKIP: "pp* *-musllinux_* *-manylinux_i686 cp38-*"
          CIBW_TEST_REQUIRES: "fastapi httpx"
          CIBW_TEST_COMMAND: "python -m fastapim_equiv_selftest"
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  release:
    # タグ(v*)のときだけ、全ホイールとsdistをGitHub Releaseに添付する(PyPIへは上げない)。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Wheels (manylinux x86_64/aarch64, macOS Intel/Apple silicon, Windows) and sdist. Each wheel passed the router equivalence test in CI. Install: pip install <wheel>."
