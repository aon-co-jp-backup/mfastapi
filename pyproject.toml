[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapim"
version = "0.1.1"
description = "Mojo/C accelerated route matching and IR tooling for FastAPI/Starlette (Starlette-compatible, verified by differential testing)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["starlette"]
license = { text = "MIT" }

[project.optional-dependencies]
fastapi = ["fastapi"]

[project.urls]
Homepage = "https://github.com/aon-co-jp/FastAPIM"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["fastapim"]
py-modules = ["fastapim_cext_selftest", "fastapim_equiv_selftest"]
