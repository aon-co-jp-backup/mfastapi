[build-system]
requires = ["setuptools>=64", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapim"
version = "0.2.0"
description = "Mojo/C accelerated route matching and IR tooling for FastAPI/Starlette (Starlette-compatible, verified by differential testing)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["starlette"]
license = { text = "MIT" }

[project.optional-dependencies]
fastapi = ["fastapi"]

[project.urls]
Homepage = "https://github.com/aon-co-jp/FastAPIM"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["fastapim"]
py-modules = ["fastapim_cext_selftest", "fastapim_equiv_selftest"]

[[tool.cibuildwheel.overrides]]
select = "*-win32"
inherit.environment = "append"
environment = { CARGO_BUILD_TARGET = "i686-pc-windows-msvc" }
