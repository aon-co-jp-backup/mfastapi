[build-system]
requires = ["setuptools>=64", "setuptools-rust>=1.9"]
build-backend = "setuptools.build_meta"

[project]
name = "mfastapi"
version = "0.2.2"
description = "MFastAPI: FastAPI-compatible framework with Python syntax on the surface and Rust inside (Mojo/RMojo friendly); Starlette-compatible route matching verified by differential testing"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["starlette"]
license = { text = "MIT" }

[project.optional-dependencies]
fastapi = ["fastapi"]

[project.urls]
Homepage = "https://github.com/aon-co-jp/MFastAPI"

[tool.setuptools]
package-dir = { "" = "python" }
packages = ["mfastapi"]
py-modules = ["mfastapi_cext_selftest", "mfastapi_equiv_selftest"]

[[tool.cibuildwheel.overrides]]
select = "*-win32"
inherit.environment = "append"
environment = { CARGO_BUILD_TARGET = "i686-pc-windows-msvc" }
