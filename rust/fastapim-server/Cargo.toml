[package]
name = "fastapim-server"
version = "0.1.0"
edition = "2021"
description = "FastAPIM HTTP server layer in Rust: FastAPI-compatible routing, 422 validation errors, OpenAPI/docs; handlers in Rust or Python"
license = "MIT"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
fastapim-core = { path = "../fastapim-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
serde_json = "1"
pyo3 = { version = "0.30", features = ["auto-initialize"], optional = true }

[profile.release]
opt-level = 3
lto = true
