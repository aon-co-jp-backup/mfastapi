[package]
name = "fastapim-py"
version = "0.1.0"
edition = "2021"
description = "CPython extension (PyO3, abi3) exposing the FastAPIM Rust core: RouteTable, parse_int, query_last"
license = "MIT"

[lib]
name = "fastapim_rust"
crate-type = ["cdylib"]

[dependencies]
fastapim-core = { path = "../fastapim-core" }
pyo3 = { version = "0.30", features = ["extension-module"] }

[profile.release]
opt-level = 3
lto = true
