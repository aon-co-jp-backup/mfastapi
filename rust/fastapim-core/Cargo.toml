[package]
name = "fastapim-core"
version = "0.1.0"
edition = "2021"
description = "FastAPIM security core: memory-safe request-value parsing (Pydantic lax int, percent-decoding, query last-wins) with hard limits"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
panic = "abort"
